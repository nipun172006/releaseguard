backend:
  replicaCount: 2
  image:
    repository: releaseguard-backend
    tag: local
    pullPolicy: IfNotPresent
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicaCount: 2
  image:
    repository: releaseguard-frontend
    tag: local
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

database:
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  name: releaseguard
  username: releaseguard
  password: releaseguard-local
  port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: ""
