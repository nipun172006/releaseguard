apiVersion: v1
kind: Secret
metadata:
  name: releaseguard-database
  labels:
    {{- include "releaseguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.password | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@database:%d/%s" .Values.database.username .Values.database.password (int .Values.database.port) .Values.database.name | quote }}
