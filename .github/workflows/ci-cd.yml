name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASEGUARD_DATABASE_URL: postgresql+psycopg://releaseguard:releaseguard_ci@localhost:5432/releaseguard_test
      RELEASEGUARD_TEST_DATABASE_URL: postgresql+psycopg://releaseguard:releaseguard_ci@localhost:5432/releaseguard_test
      RELEASEGUARD_ENVIRONMENT: test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: releaseguard_test
          POSTGRES_USER: releaseguard
          POSTGRES_PASSWORD: releaseguard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username releaseguard --dbname releaseguard_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements-dev.lock.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Apply and verify database migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run backend tests and coverage gate
        run: python -m pytest -v

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  container-delivery:
    name: Build, scan, and publish ${{ matrix.service }}
    needs:
      - backend-tests
      - frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - frontend
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/releaseguard-${{ matrix.service }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image with immutable SHA tag
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          load: true
          no-cache: true
          pull: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push "${IMAGE_NAME}:${IMAGE_TAG}"
