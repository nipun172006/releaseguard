name: releaseguard

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-releaseguard}
      POSTGRES_USER: ${POSTGRES_USER:-releaseguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - releaseguard

  backend:
    image: releaseguard-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      RELEASEGUARD_DATABASE_URL: ${RELEASEGUARD_DATABASE_URL:?Set RELEASEGUARD_DATABASE_URL in the root .env file}
      RELEASEGUARD_ENVIRONMENT: development
      RELEASEGUARD_FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - 127.0.0.1:${BACKEND_PORT:-8000}:8000
    depends_on:
      database:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - releaseguard

  frontend:
    image: releaseguard-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-5173}:8080
    depends_on:
      backend:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - releaseguard

volumes:
  postgres-data:

networks:
  releaseguard:
    driver: bridge
