testFramework:
  enabled: false

persistence:
  enabled: false

service:
  type: ClusterIP

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ReleaseGuard
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    releaseguard:
      json: |
        {
          "annotations": {"list": []},
          "editable": true,
          "graphTooltip": 0,
          "links": [],
          "panels": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {
                "defaults": {"unit": "short"},
                "overrides": []
              },
              "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
              "id": 1,
              "options": {
                "colorMode": "value",
                "graphMode": "area",
                "justifyMode": "auto",
                "orientation": "auto",
                "reduceOptions": {
                  "calcs": ["lastNotNull"],
                  "fields": "",
                  "values": false
                },
                "textMode": "auto"
              },
              "targets": [
                {
                  "editorMode": "code",
                  "expr": "sum(releaseguard_http_requests_total)",
                  "legendFormat": "requests",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "Total HTTP Requests",
              "type": "stat"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {
                "defaults": {"unit": "reqps"},
                "overrides": []
              },
              "gridPos": {"h": 8, "w": 16, "x": 8, "y": 0},
              "id": 2,
              "options": {
                "legend": {"displayMode": "list", "placement": "bottom"},
                "tooltip": {"mode": "single", "sort": "none"}
              },
              "targets": [
                {
                  "editorMode": "code",
                  "expr": "sum(rate(releaseguard_http_requests_total[1m]))",
                  "legendFormat": "requests/second",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "HTTP Request Rate",
              "type": "timeseries"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "fieldConfig": {
                "defaults": {"unit": "s"},
                "overrides": []
              },
              "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
              "id": 3,
              "options": {
                "legend": {"displayMode": "list", "placement": "bottom"},
                "tooltip": {"mode": "single", "sort": "none"}
              },
              "targets": [
                {
                  "editorMode": "code",
                  "expr": "sum(rate(releaseguard_http_request_duration_seconds_sum[1m])) / sum(rate(releaseguard_http_request_duration_seconds_count[1m]))",
                  "legendFormat": "average latency",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "Average HTTP Request Duration",
              "type": "timeseries"
            }
          ],
          "refresh": "10s",
          "schemaVersion": 41,
          "tags": ["releaseguard", "prometheus"],
          "templating": {"list": []},
          "time": {"from": "now-15m", "to": "now"},
          "timezone": "browser",
          "title": "ReleaseGuard Application Metrics",
          "uid": "releaseguard-observability",
          "version": 1
        }
